<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="รายวิชา การออกแบบปฏิสัมพันธ์ระหว่างมนุษย์และคอมพิวเตอร์"
    />
    <title>การออกแบบปฏิสัมพันธ์ระหว่างมนุษย์และคอมพิวเตอร์</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f3f6fb;
        color: #17233c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 900px);
      }

      .banner {
        position: relative;
        overflow: hidden;
        padding: clamp(40px, 8vw, 88px) clamp(24px, 7vw, 72px);
        border-radius: 28px;
        background: linear-gradient(135deg, #173b72, #2869a8 58%, #43a6b8);
        box-shadow: 0 24px 60px rgb(23 59 114 / 18%);
        text-align: center;
        color: #fff;
      }

      .banner::before,
      .banner::after {
        position: absolute;
        width: 220px;
        height: 220px;
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 50%;
        content: "";
      }

      .banner::before {
        top: -130px;
        left: -70px;
      }

      .banner::after {
        right: -100px;
        bottom: -155px;
        width: 300px;
        height: 300px;
      }

      .content {
        position: relative;
        z-index: 1;
      }

      h1 {
        margin: 0 auto 28px;
        font-size: clamp(1.8rem, 5vw, 3.25rem);
        line-height: 1.4;
        text-wrap: balance;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 48px;
        padding: 12px 20px;
        border: 1px solid rgb(255 255 255 / 65%);
        border-radius: 999px;
        background: #fff;
        color: #173b72;
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgb(8 35 71 / 22%);
      }

      a:focus-visible {
        outline: 3px solid #ffdc7a;
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="banner" aria-labelledby="course-title">
        <div class="content">
          <h1 id="course-title">
            รายวิชา การออกแบบปฏิสัมพันธ์ระหว่างมนุษย์และคอมพิวเตอร์
          </h1>
          <a
            href="https://liveupac-my.sharepoint.com/:f:/r/personal/rattasak_pe_up_ac_th/_layouts/15/onedrive.aspx?id=%2Fpersonal%2Frattasak%5Fpe%5Fup%5Fac%5Fth%2FDocuments%2F222133%5B1%5D%20Human%2DComputer%20Interaction%20Design&amp;share=cgq8KpMNJv35RrUFWl%5Fkr02%5FEgUC9KBNQkKKXsAOIYZhNE0PgA"
            target="_blank"
            rel="noopener noreferrer"
          >
            222133[1] Human-Computer Interaction Design
            <span aria-hidden="true">↗</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
